apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openanonymiser-staging
  namespace: argocd
spec:
  project: default
  source:
    # The repository is now ConductionNL/anonymiq. The old URL still works, but
    # only through GitHub's rename redirect — which stops the moment anyone
    # creates a new repo under the old name. The Application name, namespace
    # and chart path below stay on the old name: those identify live cluster
    # objects and move with a deployment change, not with this rename.
    repoURL: https://github.com/ConductionNL/anonymiq.git
    targetRevision: staging  # ← Staging wijst naar staging branch  
    path: charts/openanonymiser
    helm:
      valueFiles:
        - values-staging.yaml  # ← Use staging-specific values
      parameters:
        - name: image.tag
          value: dev
        - name: image.pullPolicy
          value: Always
        - name: ingress.hosts[0].host
          value: api.openanonymiser.accept.commonground.nu
        - name: ingress.tls[0].secretName
          value: openanonymiser-accept-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: openanonymiser-staging  # ← Staging namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true