apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openanonymiser-production
  namespace: argocd
spec:
  project: default
  source:
    # The repository is now ConductionNL/anonymiq. The old URL still works, but
    # only through GitHub's rename redirect — which stops the moment anyone
    # creates a new repo under the old name. The Application name, namespace
    # and chart path below stay on the old name: those identify live cluster
    # objects and move with a deployment change, not with this rename.
    repoURL: https://github.com/ConductionNL/anonymiq.git
    targetRevision: main  # ← Production wijst naar main branch
    path: charts/openanonymiser
  destination:
    server: https://kubernetes.default.svc
    namespace: openanonymiser  # ← Production namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true