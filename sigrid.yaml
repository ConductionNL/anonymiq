# Sigrid analysis scope for anonymiq.
#
# Every key below is documented at
# https://docs.sigrid-says.com/reference/analysis-scope-configuration.html
# Sigrid's default excludes (node_modules, build output, docs, mocks and stubs)
# still apply on top of this file. ARCHITECTURE.md explains the component map
# and the directory roles in prose.

# Pin the maintainability model, so a yearly recalibration never changes the
# rating without a deliberate change to this file.
model: "2026"

# The technologies we write. Listing them switches off automatic detection, so
# the shell and PowerShell helpers under scripts/ are not analysed.
languages:
  - name: python
    production:
    test:
      include:
        - ".*/tests?/.*[.]py"
        - ".*/test_[^/]*[.]py"
        - ".*/conftest[.]py"
        - ".*/scripts/run_tests[.]py"
  - name: typescript
    production:
    test:
      include:
        - ".*[.](spec|test)[.]tsx?"
  - name: javascript
    production:
    test:
      include:
        - ".*[.](spec|test)[.]js"

# Components follow what the service does, not the FastAPI layers.
components:
  # Entity detection: the NLP engines, the recognisers and the text analysis service.
  - name: "Text analysis"
    include:
      - ".*/src/api/services/.*[.]py"
      - ".*/src/api/utils/nlp/.*[.]py"
      - ".*/src/api/utils/patterns[.]py"
      - ".*/src/api/routers/text_analysis[.]py"
  # Document upload, PDF anonymisation and de-anonymisation, and their storage.
  - name: "Documents"
    include:
      - ".*/src/api/routers/documents[.]py"
      - ".*/src/api/crud[.]py"
      - ".*/src/api/models[.]py"
      - ".*/src/api/database[.]py"
      - ".*/src/api/utils/pdf_xmp[.]py"
      - ".*/src/api/utils/crypto[.]py"
  # Application start-up, configuration, request and response models.
  - name: "API wiring"
    include:
      - ".*/src/api/[^/]*[.]py"
      - ".*/src/api/routers/__init__[.]py"
      - ".*/src/api/utils/__init__[.]py"
      - ".*/src/__init__[.]py"
      - ".*/api[.]py"
    exclude:
      - ".*/src/api/crud[.]py"
      - ".*/src/api/models[.]py"
      - ".*/src/api/database[.]py"
  # The React front end.
  - name: "Web interface"
    include:
      - ".*/src/ui/.*"
  # Health check and developer scripts.
  - name: "Developer tooling"
    include:
      - ".*/scripts/.*"
