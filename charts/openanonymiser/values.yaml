# Default values for presidio-nl-v2
replicaCount: 1

image:
  repository: mwest2020/openanonymiser
  tag: main
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    # No ingress CORS: enable-cors without cors-allow-origin answers every origin
    # with "*". The app answers CORS itself, only for app.cors.allowedOrigins.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: "api.openanonymiser.commonground.nu"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: openanonymiser-tls
      hosts:
        - api.openanonymiser.commonground.nu

resources:
  limits:
    cpu: 1500m
    memory: 8Gi
  requests:
    cpu: 500m
    memory: 4Gi

persistence:
  enabled: true
  storageClass: "nfs"
  size: 25Gi
  # Critical: This volume stores:
  # - SQLite database (/app/data/openanonymiser.db)
  # - Uploaded files (/app/data/temp/source/)
  # - Processed files (/app/data/temp/anonymized/, /app/data/temp/deanonymized/)
  # - Application logs (/app/data/logs/)

networkPolicy:
  enabled: false
  allowedNamespaces:
    - presidio
    - default

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

app:
  debug: false
  logLevel: "info"
  api:
    host: "0.0.0.0"
    port: 8080
    internalOnly: false
  storage:
    cleanupInterval: 3600
  # Environment variables from docker-compose
  env:
    uvicornServerMode: "production"
    defaultNlpEngine: "spacy"
    defaultSpacyModel: "nl_core_news_md"
    defaultTransformersModel: "pdelobelle/robbert-v2-dutch-base"
    cryptoKey: "your-secret-crypto-key"
  # HTTP Basic credentials for /api/v1/documents, /analyze and /anonymize. Required: with
  # no password set, each of those routes answers 401 (fail closed). Prefer
  # existingSecret, so the password never sits in git or in the Argo CD app.
  auth:
    # Name of a Secret holding the credentials. When set, username/password
    # below are ignored.
    existingSecret: ""
    usernameKey: "username"
    passwordKey: "password"
    username: "admin"
    password: ""
  # Browser origins allowed to call the API, comma separated. Empty keeps CORS
  # off, which is right for server to server callers (they send no Origin).
  # A wildcard is refused at startup.
  cors:
    allowedOrigins: ""
