name: Deploy to Production

# Production is released from a version tag only. A merge to main builds and
# scans the image (docker-build.yml) but publishes nothing. Pushing a tag
# vX.Y.Z runs the full CI, builds the image, scans it, and only then pushes
# :vX.Y.Z, :latest and :main, which Argo CD rolls out from the main branch.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/conductionnl/anonymiq

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    name: Build, scan and push production image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Production version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # The image carries torch and two NLP models; the hosted runner needs
      # the space to hold it twice (build cache and the loaded image).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
          format: table

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/ConductionNL/anonymiq
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha

      - name: Deployment summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "Images pushed:"
            echo "- \`${IMAGE_NAME}:${VERSION}\`"
            echo "- \`${IMAGE_NAME}:latest\`"
            echo "- \`${IMAGE_NAME}:main\`"
            echo ""
            echo "Argo CD deploys this version to production: https://argocd.commonground.nu"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Docker image: `${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}`
            Health check: https://api.openanonymiser.commonground.nu/api/v1/health

  # The API routes require HTTP Basic, which this job has no credentials for,
  # so the smoke test checks the public health route.
  test-production:
    name: Test production deployment
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Argo CD to sync
        run: sleep 300

      - name: Health check over TLS
        run: curl -fsS --retry 5 --retry-delay 30 https://api.openanonymiser.commonground.nu/api/v1/health
