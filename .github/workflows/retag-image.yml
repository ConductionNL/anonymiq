name: Retag image (copy a digest to version/main/latest on GHCR)

# Copies an existing image, pinned by digest, to tags on
# ghcr.io/conductionnl/anonymiq without rebuilding it. The source can be an
# image already on GHCR (promote what staging ran) or the old Docker Hub
# image (seed GHCR before the Helm values point at it).
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source image by digest, e.g. ghcr.io/conductionnl/anonymiq@sha256:... or docker.io/mwest2020/openanonymiser@sha256:...'
        required: true
      version:
        description: 'Version tag to create (e.g. v1.3.1)'
        required: true
      promote_latest:
        description: 'Also tag as latest'
        type: boolean
        required: true
        default: true
      promote_main:
        description: 'Also tag as main (what production runs)'
        type: boolean
        required: true
        default: true
      promote_dev:
        description: 'Also tag as dev (what staging runs)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/conductionnl/anonymiq

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the image to the requested tags
        env:
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          PROMOTE_LATEST: ${{ inputs.promote_latest }}
          PROMOTE_MAIN: ${{ inputs.promote_main }}
          PROMOTE_DEV: ${{ inputs.promote_dev }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE" != *@sha256:* ]]; then
            echo "::error::source must be pinned by digest (image@sha256:...)"
            exit 1
          fi
          tags=(-t "${IMAGE_NAME}:${VERSION}")
          [ "$PROMOTE_LATEST" = "true" ] && tags+=(-t "${IMAGE_NAME}:latest")
          [ "$PROMOTE_MAIN" = "true" ] && tags+=(-t "${IMAGE_NAME}:main")
          [ "$PROMOTE_DEV" = "true" ] && tags+=(-t "${IMAGE_NAME}:dev")
          docker buildx imagetools create "${tags[@]}" "$SOURCE"
          {
            echo "### Retag complete"
            echo ""
            echo "- Source: \`${SOURCE}\`"
            echo "- Tags:"
            for ((i = 1; i < ${#tags[@]}; i += 2)); do
              echo "  - \`${tags[$i]}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
