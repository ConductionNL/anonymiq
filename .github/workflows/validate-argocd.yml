name: Validate ArgoCD Applications

on:
  pull_request:
    branches: [ main, staging, development ]
  push:
    branches: [ main, staging ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Validate ArgoCD Applications
        run: |
          python - <<'PY'
          import sys, yaml, pathlib

          def load(path):
              with open(path, 'r', encoding='utf-8') as f:
                  return yaml.safe_load(f)

          root = pathlib.Path('argocd')
          staging = load(root / 'staging-app.yaml')
          prod = load(root / 'production-app.yaml')

          errors = []

          # Staging expectations
          try:
              s_src = staging['spec']['source']
              s_dest = staging['spec']['destination']
              s_values = s_src.get('helm', {}).get('valueFiles', [])
              if s_src.get('targetRevision') != 'staging':
                  errors.append('staging-app: targetRevision must be "staging"')
              if s_src.get('path') != 'charts/openanonymiser':
                  errors.append('staging-app: path must be charts/openanonymiser')
              if 'values-staging.yaml' not in s_values:
                  errors.append('staging-app: helm.valueFiles must include values-staging.yaml')
              if s_dest.get('namespace') != 'openanonymiser-staging':
                  errors.append('staging-app: namespace must be openanonymiser-staging')
          except Exception as e:
              errors.append(f'staging-app: parse error: {e}')

          # Production expectations
          try:
              p_src = prod['spec']['source']
              p_dest = prod['spec']['destination']
              p_values = p_src.get('helm', {}).get('valueFiles', [])
              if p_src.get('targetRevision') != 'main':
                  errors.append('production-app: targetRevision must be "main"')
              if p_src.get('path') != 'charts/openanonymiser':
                  errors.append('production-app: path must be charts/openanonymiser')
              if p_values:
                  errors.append('production-app: helm.valueFiles must be empty (use default values.yaml)')
              if p_dest.get('namespace') != 'openanonymiser':
                  errors.append('production-app: namespace must be openanonymiser')
          except Exception as e:
              errors.append(f'production-app: parse error: {e}')

          # Validate Helm image tags per environment
          charts = pathlib.Path('charts/openanonymiser')
          try:
              vals_prod = load(charts / 'values.yaml')
              image_tag_prod = vals_prod.get('image', {}).get('tag')
              if image_tag_prod not in ('main', 'latest'):
                  errors.append(f'values.yaml: image.tag should be "main" or "latest", found "{image_tag_prod}"')
              # Prod ingress host and tls
              prod_hosts = (vals_prod.get('ingress', {}) or {}).get('hosts', [])
              if not prod_hosts or prod_hosts[0].get('host') != 'api.openanonymiser.commonground.nu':
                  errors.append('values.yaml: ingress.hosts[0].host must be api.openanonymiser.commonground.nu')
              prod_tls = (vals_prod.get('ingress', {}) or {}).get('tls', [])
              if not prod_tls or prod_tls[0].get('secretName') != 'openanonymiser-tls':
                  errors.append('values.yaml: ingress.tls[0].secretName must be openanonymiser-tls')
          except Exception as e:
              errors.append(f'values.yaml: parse error: {e}')

          try:
              vals_stg = load(charts / 'values-staging.yaml')
              image_tag_stg = vals_stg.get('image', {}).get('tag')
              if image_tag_stg != 'dev':
                  errors.append(f'values-staging.yaml: image.tag should be "dev", found "{image_tag_stg}"')
              pull_policy_stg = vals_stg.get('image', {}).get('pullPolicy')
              if pull_policy_stg != 'Always':
                  errors.append(f'values-staging.yaml: image.pullPolicy should be "Always", found "{pull_policy_stg}"')
              # Staging ingress host and tls
              stg_hosts = (vals_stg.get('ingress', {}) or {}).get('hosts', [])
              if not stg_hosts or stg_hosts[0].get('host') != 'api.openanonymiser.accept.commonground.nu':
                  errors.append('values-staging.yaml: ingress.hosts[0].host must be api.openanonymiser.accept.commonground.nu')
              stg_tls = (vals_stg.get('ingress', {}) or {}).get('tls', [])
              if not stg_tls or stg_tls[0].get('secretName') != 'openanonymiser-accept-tls':
                  errors.append('values-staging.yaml: ingress.tls[0].secretName must be openanonymiser-accept-tls')
          except Exception as e:
              errors.append(f'values-staging.yaml: parse error: {e}')

          if errors:
              print('Validation errors:')
              for e in errors:
                  print('-', e)
              sys.exit(1)
          else:
              print('ArgoCD Applications validation passed.')
          PY


