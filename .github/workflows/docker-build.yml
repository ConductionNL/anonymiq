name: Build and Push Docker Images

# Builds and scans the image on pull requests and on pushes to staging and
# development, and pushes :dev for those two branches. Production images
# (:vX.Y.Z, :latest, :main) come only from deploy-production.yml on a version
# tag, so a merge to main publishes nothing.
on:
  push:
    branches: [ staging, development ]
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (e.g. staging, development, v1.2.0)'
        required: true
        default: 'staging'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/conductionnl/anonymiq

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Determine version and tags
        id: meta
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          REF="${INPUT_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Using REF=$REF"

          if [[ "$REF" == "main" ]]; then
            echo "::error::Production images are published by deploy-production.yml from a version tag."
            exit 1
          elif [[ "$REF" == "staging" || "$REF" == "development" ]]; then
            VERSION="dev"
            TAGS="${IMAGE_NAME}:dev"
          elif [[ "$REF" == v* ]]; then
            VERSION="$REF"
            TAGS="${IMAGE_NAME}:${VERSION}"
          else
            # Pull request: built and scanned, never pushed.
            VERSION="dev-${GITHUB_SHA::7}"
            TAGS="${IMAGE_NAME}:${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # The image carries torch and two NLP models; the hosted runner needs
      # the space to hold it twice (build cache and the loaded image).
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails on fixable CRITICAL findings; HIGH findings are listed in the
      # report without failing the build.
      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          output: trivy-report.txt

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'
          TRIVY_SKIP_JAVA_DB_UPDATE: 'true'
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
          format: table

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 30

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/ConductionNL/anonymiq
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Image pushed summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "Images pushed to GHCR:"
            IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
            for tag in "${TAG_ARRAY[@]}"; do
              echo "- \`${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
