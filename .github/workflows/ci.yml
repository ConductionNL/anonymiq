name: CI

# Runs on every pull request and on every push except to main, and is called
# by the deploy workflows, so nothing is published without these checks.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.10.8"
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.17.0"
  MYPY_VERSION: "2.4.0"
  PYTEST_COV_VERSION: "7.1.0"
  PIP_AUDIT_VERSION: "2.10.1"
  # Line coverage of src/api by tests/unit (37.9% on 2026-10-29). Raise it when
  # coverage goes up; it must never go down.
  COVERAGE_MIN: "37"

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff lint
        run: uvx "ruff@${RUFF_VERSION}" check --output-format github .

      - name: Ruff format
        run: uvx "ruff@${RUFF_VERSION}" format --check --diff .

      # Locked versions, minus torch, its CUDA wheels and the spaCy model: the
      # unit tests run the app in process and load neither.
      - name: Install dependencies
        run: |
          SKIP=$(grep -oE '^name = "(torch|triton|nvidia-[a-z0-9-]+|nl-core-news-lg)"' uv.lock \
            | sed -E 's/name = "(.*)"/--no-install-package \1/')
          # shellcheck disable=SC2086 # one flag per word
          uv sync --frozen $SKIP

      - name: Mypy
        run: uv run --frozen --no-sync --with "mypy==${MYPY_VERSION}" mypy src/api

      - name: Pytest with coverage
        run: |
          uv run --frozen --no-sync --with "pytest-cov==${PYTEST_COV_VERSION}" \
            python -m pytest tests/unit -p no:cacheprovider \
            --cov=src/api --cov-report=xml:coverage.xml --cov-report=term \
            --cov-fail-under="${COVERAGE_MIN}"

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Coverage (minimum ${COVERAGE_MIN}%)"
              echo '```'
              uv run --frozen --no-sync --with "pytest-cov==${PYTEST_COV_VERSION}" coverage report --format=total
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: CycloneDX SBOM from uv.lock
        run: uv export --frozen --no-dev --format cyclonedx1.5 --preview-features sbom-export -o sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      # Audits the runtime dependencies pinned in uv.lock. The spaCy model is
      # a URL wheel that no advisory database covers, so pip-audit skips it.
      # Report-only for now: the findings go to the job summary and a warning,
      # and the job stays green. Make it blocking again (remove
      # continue-on-error) once the known vulnerabilities in uv.lock are fixed.
      - name: pip-audit (report only)
        continue-on-error: true
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements.txt -o requirements-audit.txt
          uvx "pip-audit@${PIP_AUDIT_VERSION}" -r requirements-audit.txt --no-deps --disable-pip \
            --progress-spinner off --desc on --format markdown --output pip-audit.md || status=$?
          {
            echo "### pip-audit (report only)"
            cat pip-audit.md
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${status:-0}" != "0" ]; then
            echo "::warning title=pip-audit::Known vulnerabilities in uv.lock, see the job summary"
          fi
          exit "${status:-0}"

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - name: Lint and render each values file
        run: |
          chart=charts/openanonymiser
          for values in "" values-staging.yaml values-production.yaml; do
            args=()
            if [ -n "$values" ]; then args=(-f "$chart/$values"); fi
            echo "::group::${values:-values.yaml}"
            helm lint --strict "$chart" "${args[@]}"
            helm template anonymiq "$chart" "${args[@]}" > /dev/null
            echo "::endgroup::"
          done

  ui:
    name: UI (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  # Publishing from feature branches is opt in. Staging pulls the `dev` tag
  # with pullPolicy Always, so publishing from every green feature branch
  # would put unreviewed code on staging. Set the repository variable
  # PUBLISH_FEATURE_IMAGES=true to enable it.
  publish-feature-image:
    name: Publish feature image (opt in)
    needs: [python, dependencies, helm, ui]
    if: >-
      github.event_name == 'push'
      && vars.PUBLISH_FEATURE_IMAGES == 'true'
      && github.ref_name != 'staging'
      && github.ref_name != 'development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/ConductionNL/anonymiq
          tags: |
            ghcr.io/conductionnl/anonymiq:dev
            ghcr.io/conductionnl/anonymiq:feature-${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Move the dev tag to this commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -f dev -m "Auto-tagged dev from ${GITHUB_REF_NAME} - CI passed"
          git push origin dev --force
