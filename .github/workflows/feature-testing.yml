name: Feature Branch Testing

on:
  push:
    branches-ignore:
      - main
      - staging
      - development
  pull_request:
    branches: [ main, development ]

jobs:
  test-and-tag:
    name: Test and Auto-tag
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        # Locked versions, minus torch, its CUDA wheels and the spaCy model:
        # the unit tests run the app in process and load neither.
        run: |
          SKIP=$(grep -oE '^name = "(torch|triton|nvidia-[a-z0-9-]+|nl-core-news-lg)"' uv.lock \
            | sed -E 's/name = "(.*)"/--no-install-package \1/')
          uv sync --frozen --python 3.12 $SKIP

      # This step used to run `python run_tests.py` from the repo root, where
      # no such file exists, so no test ever ran. scripts/run_tests.py is a
      # local helper (it starts a server, builds Docker, pushes tags); CI runs
      # pytest directly, and a failing test fails the job.
      - name: Run unit tests
        run: uv run --frozen --no-sync python -m pytest tests/unit -v -p no:cacheprovider

      # Publishing is opt in. Staging pulls the `dev` tag with pullPolicy
      # Always, so publishing from every green feature branch would put
      # unreviewed code on staging. Set the repository variable
      # PUBLISH_FEATURE_IMAGES=true to restore the old behaviour.

      - name: Set up Docker Buildx (if tests passed)
        if: github.event_name == 'push' && vars.PUBLISH_FEATURE_IMAGES == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (if tests passed)
        if: github.event_name == 'push' && vars.PUBLISH_FEATURE_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push dev image (if tests passed)
        if: github.event_name == 'push' && vars.PUBLISH_FEATURE_IMAGES == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mwest2020/openanonymiser:dev
            mwest2020/openanonymiser:feature-${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push dev tag (if tests passed)
        if: github.event_name == 'push' && vars.PUBLISH_FEATURE_IMAGES == 'true'
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          # Create dev tag with message
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Force update dev tag
          git tag -f dev -m "Auto-tagged dev from ${BRANCH_NAME} - tests passed"
          git push origin dev --force
          
          echo "✅ Dev tag updated and pushed!" >> $GITHUB_STEP_SUMMARY
