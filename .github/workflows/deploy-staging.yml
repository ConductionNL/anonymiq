name: Deploy to Staging

# Staging runs the dev image (values-staging.yaml: tag dev, pullPolicy Always).
# A push to staging runs the full CI first, then pushes :dev and a dated
# staging tag.
on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/conductionnl/anonymiq

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    name: Build and push staging image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate tags
        id: meta
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "main_tag=staging-${TIMESTAMP}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/ConductionNL/anonymiq
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.main_tag }}
            ${{ env.IMAGE_NAME }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment summary
        run: |
          {
            echo "Image: \`${IMAGE_NAME}:${{ steps.meta.outputs.main_tag }}\` (alias \`dev\`)"
            echo ""
            echo "Argo CD syncs staging within a few minutes."
          } >> "$GITHUB_STEP_SUMMARY"

  # The API routes require HTTP Basic, which this job has no credentials for,
  # so the smoke test checks the public health route.
  test-deployment:
    name: Test staging deployment
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Argo CD to sync
        run: sleep 180

      - name: Health check over TLS
        run: curl -fsS --retry 5 --retry-delay 30 https://api.openanonymiser.accept.commonground.nu/api/v1/health
